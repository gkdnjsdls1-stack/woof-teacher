<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  role="img"
  aria-label="월월 선생님"
>
  <!--
    홈 화면 아이콘 (SVG 플레이스홀더).
    maskable 안전 영역을 지키려고 그림을 가운데 80% 안에만 그렸습니다.
    (안드로이드가 아이콘을 원형·물방울 모양으로 잘라도 귀가 안 잘립니다.)
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3E2" />
      <stop offset="1" stop-color="#FFD9E8" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- 귀 -->
  <ellipse cx="152" cy="272" rx="38" ry="74" fill="#8E5526" />
  <ellipse cx="360" cy="272" rx="38" ry="74" fill="#8E5526" />

  <!-- 머리 -->
  <circle cx="256" cy="268" r="118" fill="#C9854A" />

  <!-- 볼 -->
  <ellipse cx="170" cy="308" rx="26" ry="18" fill="#F9B8C4" opacity="0.65" />
  <ellipse cx="342" cy="308" rx="26" ry="18" fill="#F9B8C4" opacity="0.65" />

  <!-- 눈 (기쁨) -->
  <path
    d="M196,252 q20,-26 40,0"
    stroke="#3C2B22"
    stroke-width="13"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M276,252 q20,-26 40,0"
    stroke="#3C2B22"
    stroke-width="13"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 주둥이 -->
  <ellipse cx="256" cy="322" rx="64" ry="46" fill="#DFA873" />
  <ellipse cx="256" cy="300" rx="23" ry="17" fill="#3C2B22" />

  <!-- 입 -->
  <path
    d="M256,317 v16"
    stroke="#3C2B22"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M256,333 q-20,18 -36,2"
    stroke="#3C2B22"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M256,333 q20,18 36,2"
    stroke="#3C2B22"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 혀 -->
  <path d="M242,352 q14,26 28,0 z" fill="#F28BA0" />
</svg>
